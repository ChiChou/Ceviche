# Converts the Core ML models and publishes them as a model-set release (models-v1, models-v2, ...), separate from
# app versions, then opens a pull request that pins the set in the app (CevicheCore/Resources/ModelSet.json: tag and
# the SHA-256 of every asset). Run it when a model, its pinned revision or a convert script changes. A published set
# is never overwritten: every app build that pins it downloads exactly those bytes.
name: Models
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the new model set (models-v1, models-v2, ...); it must not exist yet
        required: true
        default: models-v1
permissions:
  contents: write
  pull-requests: write
jobs:
  convert:
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^models-v[0-9]+$ ]] || { echo "::error::$TAG is not of the form models-v<number>."; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists; model sets are immutable, choose the next number."
            exit 1
          fi
      - uses: astral-sh/setup-uv@v10
      - name: Cache model sources
        uses: actions/cache@v6
        with:
          path: models/cache
          key: model-sources-${{ hashFiles('models/fetch-models.sh') }}
          restore-keys: model-sources-
      - name: Download and convert
        run: models/fetch-models.sh
      - name: Package
        env:
          CEVICHE_MODELS_REPO: ${{ github.repository }}
        run: models/package-models.sh "$TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.tag }}
          path: models/dist
      - name: Publish the model set
        run: |
          {
            echo "Core ML models for Ceviche, converted from the pinned sources listed in [models/MODELS.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/models/MODELS.md) by [models/fetch-models.sh](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/models/fetch-models.sh) at $GITHUB_SHA. Each model is its own uncompressed Apple Archive, \`<Name>.aar\`, holding the model and its \`LICENSE\`; double-click one or run \`aa extract -i <Name>.aar -d <folder>\` to unpack it by hand."
            echo
            echo "Ceviche downloads these in **Ceviche › Models…** once a build pins this set (\`ModelSet.json\`). This release is not an app version."
            echo
            echo '```'; cat models/dist/SHA256SUMS; echo '```'
          } > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --latest=false --title "Model set $TAG" --notes-file notes.md models/dist/*
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Propose the pin
        # The app only downloads a set it pins, so the manifest goes into the app through a pull request. If the
        # repository does not let Actions open pull requests, the manifest is on the release: make models-pin TAG=...
        run: |
          branch="pin/$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          cp models/dist/ModelSet.json app/Sources/CevicheCore/Resources/ModelSet.json
          git add app/Sources/CevicheCore/Resources/ModelSet.json
          git commit -m "Pin model set $TAG"
          git push origin "$branch"
          if gh pr create --head "$branch" --base "$GITHUB_REF_NAME" --title "Pin model set $TAG" \
               --body "Pins the [$TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG) model set in the app, so Ceviche › Models… downloads it. Generated by the Models workflow."; then
            echo "Pull request opened from $branch." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Could not open the pull request (allow GitHub Actions to create pull requests in the repository settings, or run: make models-pin TAG=$TAG)."
            echo "Pin it by hand: make models-pin TAG=$TAG, then commit app/Sources/CevicheCore/Resources/ModelSet.json." >> "$GITHUB_STEP_SUMMARY"
          fi
