# Release build of the app for a v* tag, attached to a draft GitHub release together with the dSYMs, the encoders'
# corresponding source and checksums. Publish the draft after adding the release notes.
# The app bundles the small face models (models/models.sh MODEL_BUNDLED), fetched from the model set pinned in
# CevicheCore/Resources/ModelSet.json, and downloads the rest of that set on demand.
# Run manually (workflow_dispatch) it only builds and uploads the same files as a workflow artifact, as a dry run.
# The build is ad-hoc signed: there is no Developer ID certificate in CI, so Gatekeeper needs the quarantine
# attribute removed (or right-click → Open) and iCloud catalogs are compiled out, as for any unsigned build.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Version
        id: version
        run: |
          version="$(plutil -extract CFBundleShortVersionString raw app/Platforms/macOS/Info.plist)"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match CFBundleShortVersionString $version in app/Platforms/macOS/Info.plist."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache SwiftPM downloads
        uses: actions/cache@v6
        with:
          path: app/.build/swiftpm-cache
          key: swiftpm-${{ hashFiles('app/Package.resolved', 'app/Vendor/Package.resolved') }}
          restore-keys: swiftpm-
      - name: Cache the Xcode project's package checkouts
        uses: actions/cache@v6
        with:
          path: app/.build/xcode-packages
          key: xcode-packages-${{ hashFiles('app/Package.resolved') }}
          restore-keys: xcode-packages-
      - name: Cache the vendor codec frameworks
        uses: actions/cache@v6
        with:
          path: app/Vendor/Frameworks
          key: vendor-xcode27.1-${{ hashFiles('app/Vendor/Package.swift', 'app/Vendor/Package.resolved', 'app/scripts/vendor.sh') }}
      - name: Bundled models
        run: bash -c 'source models/models.sh && models/fetch-models.sh --prebuilt "${MODEL_BUNDLED[@]}"'
      - name: Build
        env:
          CEVICHE_REQUIRE_BUNDLED_MODELS: 1
        run: make build
      - name: Encoder corresponding source
        run: app/scripts/archive-encoder-sources.sh
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent app/dist/Ceviche.app "release/Ceviche-$VERSION.zip"
          ditto -c -k --norsrc --keepParent app/dist/dSYMs "release/Ceviche-$VERSION-dSYMs.zip"
          cp app/dist/encoder-corresponding-source.tar.gz "release/Ceviche-$VERSION-encoder-corresponding-source.tar.gz"
          (cd release && shasum -a 256 -- * > SHA256SUMS)
          ls -l release
      - uses: actions/upload-artifact@v7
        with:
          name: Ceviche-${{ steps.version.outputs.version }}
          path: release
      - name: Draft the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          models="$(python3 -I -c 'import json; print(json.load(open("app/Sources/CevicheCore/Resources/ModelSet.json")).get("tag") or "none")')"
          cat > notes.md <<NOTES
          Ceviche $VERSION for Apple silicon Macs, built by GitHub Actions. The app is signed ad hoc, not with a
          Developer ID, so after unzipping either right-click → Open once or run
          \`xattr -dr com.apple.quarantine Ceviche.app\`.

          - \`Ceviche-$VERSION.zip\`: the app, with the face models built in; Settings › Models downloads the rest of the [$models](https://github.com/$GITHUB_REPOSITORY/releases/tag/$models) model set on demand, verified by checksum.
          - \`Ceviche-$VERSION-dSYMs.zip\`: debug symbols for symbolicating crash logs.
          - \`Ceviche-$VERSION-encoder-corresponding-source.tar.gz\`: exact source of the bundled libwebp and libjxl frameworks.

          NOTES
          gh release create "$GITHUB_REF_NAME" --draft --title "Ceviche $VERSION" --notes-file notes.md --generate-notes release/*
